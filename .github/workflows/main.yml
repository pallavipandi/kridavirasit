name: Build KRIDAVIRASAT Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Get your GitHub project
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Next.js application
      - name: Build Next.js
        run: npm run build

      # 5. Build Windows EXE
      - name: Build Windows EXE
        run: npm run electron:build

      # 6. Upload EXE/installer
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: KRIDAVIRASAT-Windows
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: error
