appId: com.kridavirasat.app
productName: KRIDAVIRASAT

directories:
  output: dist

files:
  - electron/**
  - package.json

extraResources:
  - from: ".next/standalone"
    to: "next-server"

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
